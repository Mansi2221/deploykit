[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deploykit"
version = "0.1.0"
description = "Production readiness scanner for AI applications"
requires-python = ">=3.9"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Mansi" },
]
keywords = ["ai", "production", "scanner", "devops", "llm", "deployment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
]

[project.scripts]
deploykit = "deploykit.cli:main"

[project.urls]
Homepage = "https://github.com/mansi/deploykit"
Repository = "https://github.com/mansi/deploykit"
Issues = "https://github.com/mansi/deploykit/issues"

[tool.setuptools.packages.find]
include = ["deploykit*"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
